version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: portfoliai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-student_portfolio}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-student_portfolio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfoliai-web
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-portfoliai-production-secret-replace-me}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-student_portfolio}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_PER_MINUTE: "60"
      LOG_LEVEL: "INFO"
    ports:
      - "5000:5000"
    volumes:
      - upload_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  upload_data:
