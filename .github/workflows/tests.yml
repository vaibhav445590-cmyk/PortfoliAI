name: PortfoliAI Automated Test Suite

on:
  push:
    branches: [ main, master, version-b-cinematic-3d ]
  pull_request:
    branches: [ main, master, version-b-cinematic-3d ]

jobs:
  test:
    name: Run Pytest & Regression Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: student_portfolio
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Normalize Line Endings for Baseline Hash Tests
        run: |
          python -c "for p in ['static/css/style.css', 'templates/index.html', 'static/js/main.js']: open(p, 'wb').write(open(p, 'rb').read().replace(b'\r\n', b'\n').replace(b'\n', b'\r\n'))"

      - name: Initialize Database Schema
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: student_portfolio
          DB_USER: postgres
          DB_PASSWORD: testpassword
        run: |
          python -c "import psycopg2; from config import Config; conn = psycopg2.connect(**Config.get_db_params()); cur = conn.cursor(); cur.execute(open('schema.sql', 'r', encoding='utf-8').read()); conn.commit(); conn.close(); print('Database schema successfully initialized from schema.sql')"

      - name: Run Database Migrations
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: student_portfolio
          DB_USER: postgres
          DB_PASSWORD: testpassword
        run: |
          python run_migration.py

      - name: Run Pytest Suite
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: student_portfolio
          DB_USER: postgres
          DB_PASSWORD: testpassword
          PYTHONPATH: .
        run: |
          python -m pytest -v --tb=short 2>&1 | tee pytest_output.log
          STATUS=${PIPESTATUS[0]}
          echo "## Pytest Output (exit: $STATUS)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat pytest_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $STATUS
